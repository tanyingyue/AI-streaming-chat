# 本地模拟「测试环境」反代（可选，日常开发仍用 npm run dev 即可）
#
# 前置：
#   1. npm run build --prefix client          → 生成 client/dist
#   2. npm run dev:server                    → 后端 :3001
#   3. 用本配置启动 nginx，浏览器打开 http://127.0.0.1:8080
#
# Windows 示例（按你的 nginx 安装目录改路径）：
#   nginx.exe -c "D:/A茶百道-code/AI-流式对话/deploy/nginx.conf"
#
# 注意：下面 root 请改成你机器上 client/dist 的绝对路径（正斜杠）。

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  server {
    listen       8080;
    server_name  127.0.0.1 localhost;

    # ----- 前端静态资源（Vue build 产物）-----
    # TODO: 改成你本机的绝对路径，例如：
    # root D:/A茶百道-code/AI-流式对话/client/dist;
    root   D:/A茶百道-code/AI-流式对话/client/dist;
    index  index.html;

    # Vue Router history 模式：刷新子路由不 404
    location / {
      try_files $uri $uri/ /index.html;
    }

    # ----- API / SSE 反代到 Node BFF -----
    location /api/ {
      proxy_pass http://127.0.0.1:3001;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";

      # SSE 关键：关闭缓冲，拉长超时
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
